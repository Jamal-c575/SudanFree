name: jhome_admin
description: لوحة تحكم Jhome لإدارة الموقع والتطبيقات
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.14.0
  cloud_functions: ^4.6.0
  firebase_storage: ^11.6.0

  # State Management
  provider: ^6.1.1
  flutter_riverpod: ^2.4.9

  # UI
  google_fonts: ^6.1.0
  flutter_quill: ^9.2.0           # محرر نصوص غني
  cached_network_image: ^3.3.1
  file_picker: ^6.1.1
  image_picker: ^1.0.7
  flutter_dropzone: ^3.0.5        # drag & drop for web
  flutter_markdown: ^0.6.18       # عرض المقالات كـ markdown

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.2.5
  go_router: ^13.0.0              # navigation
  shared_preferences: ^2.2.2
  syncfusion_flutter_charts: ^23.2.4  # رسوم بيانية
  uuid: ^4.2.1
  http: ^1.2.0
  share_plus: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true